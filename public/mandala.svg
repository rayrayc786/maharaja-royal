      <line x1="0" y1="16" x2="0" y2="40"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(10)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(20)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(30)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(40)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(50)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(60)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(70)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(80)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(90)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(100)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(110)"/>
