      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(130)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(140)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(150)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(160)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(170)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(180)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(190)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(200)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(210)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(220)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(230)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(240)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(250)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(260)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(270)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(280)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(290)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(300)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(310)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(320)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(330)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(340)"/>
      <line x1="0" y1="16" x2="0" y2="40" transform="rotate(350)"/>
    </g>

    <!-- Inner ring -->
    <circle r="40" fill="none" stroke-width="1"/>

    <!-- Small inner petal bumps (12) -->
    <g fill="rgba(212,175,55,0.22)" stroke="none">
      <ellipse rx="4" ry="6" transform="rotate(0) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(30) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(60) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(90) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(120) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(150) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(180) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(210) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(240) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(270) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(300) translate(0,-48)"/>
      <ellipse rx="4" ry="6" transform="rotate(330) translate(0,-48)"/>
    </g>

    <!-- Mid ring -->
    <circle r="54" fill="none" stroke-width="0.7"/>

    <!-- Outer teardrop petals (12) -->
    <g fill="none" stroke-width="0.8">
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(0)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(30)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(60)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(90)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(120)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(150)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(180)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(210)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(240)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(270)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(300)"/>
      <path d="M 0,-55 C 10,-65 10,-82 0,-88 C -10,-82 -10,-65 0,-55 Z" transform="rotate(330)"/>
    </g>

    <!-- Outer ring border -->
    <circle r="90" fill="none" stroke-width="1"/>
    <circle r="93" fill="none" stroke-width="0.4"/>

    <!-- Outer scallop dots (24) -->
    <g fill="rgba(212,175,55,0.22)" stroke="none">
      <circle r="2.5" transform="translate(0,-90)"/>
      <circle r="2.5" transform="rotate(15) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(30) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(45) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(60) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(75) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(90) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(105) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(120) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(135) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(150) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(165) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(180) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(195) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(210) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(225) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(240) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(255) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(270) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(285) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(300) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(315) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(330) translate(0,-90)"/>
      <circle r="2.5" transform="rotate(345) translate(0,-90)"/>
    </g>

  </g>

  <!-- Accent dots between tiles (corners) -->
  <g fill="rgba(212,175,55,0.22)" stroke="none">
    <circle cx="100" cy="8" r="4"/>
    <circle cx="8" cy="100" r="4"/>
    <circle cx="192" cy="100" r="4"/>
    <circle cx="100" cy="192" r="4"/>
  </g>
</svg>
